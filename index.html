<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 4 - Flexbox</title>
    <style>
      .book-container{
        background-color: beige;
        display: flex;
        height: 400px;
        justify-content: space-around;
        align-items: center;
    }
      .book-item{
        background-color: aliceblue;
        width: 200px;
      }

      .book2{
        background-color: rgb(130, 197, 192);
        display: flex;
        height: 300px;
        justify-content: space-around;
        align-items: center;
    }
      .book-item2{
        background-color: rgb(236, 92, 164);
        width: 150px;
      }

      .book3{
        background-color: rgb(71, 145, 214);
        display: flex;
        height: 600px;
        justify-content: space-around;
        align-items: center;
    }
      .book-item3{
        background-color: rgb(255, 242, 64);
        width: 300px;
      }

    </style>
  </head>
  <body>
    <h1>Cozy Reads</h1>

    <div class="book-container">


      <img
        src="https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1654581271i/61242426.jpg"
        width="200"
        class="book-item"
      />
      <p class="book-item">
        It’s not easy to build a coffee shop in a place that has never had
        coffee before. #CozyFantasy
      </p>
    </div>
    
    <div class="book2">
    <img
      src="https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1569514209i/45047384.jpg"
      width="200"
      class="book-item2"
    />
    <p class="book-item2">
      The main character must oversee an inspection of a house for magical
      children. #CozyFantasy
    </p>
    </div>

    <div class="book3">
    <img
      src="https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1601307658i/53310061.jpg"
      width="200"
      class="book-item3"
    />
    <p class="book-item3">
      Who better to help cover up an accidental murder than overly protective
      aunties. #CozyMystery
    </p>
    </div>

  </body>
</html>
